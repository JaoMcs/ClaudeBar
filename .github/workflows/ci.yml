name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # CFBundleVersion = git rev-list --count HEAD
      - name: Versão do Swift
        run: swift --version
      - name: Testes (compila tudo)
        run: swift test
      - name: Empacotar o .app (build release)
        run: ./scripts/build-app.sh
      - name: Conferir o bundle (ícone e assinatura)
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/Awaitbar.app/Contents/Info.plist)" = AppIcon
          test -s build/Awaitbar.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict build/Awaitbar.app
